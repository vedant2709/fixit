name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./services/booking-service
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./services/booking-service
        run: |
          docker build -t $ECR_REGISTRY/booking-service:$IMAGE_TAG .
          docker push $ECR_REGISTRY/booking-service:$IMAGE_TAG
          docker tag $ECR_REGISTRY/booking-service:$IMAGE_TAG $ECR_REGISTRY/booking-service:latest
          docker push $ECR_REGISTRY/booking-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fixit
            # Pull new image from ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 319125696408.dkr.ecr.us-east-1.amazonaws.com
            # Stop and restart services
            sudo docker-compose down
            sudo docker-compose pull
            sudo docker-compose up -d
            # Clean up old images
            sudo docker image prune -f

      - name: Verify deployment
        run: |
          curl http://44.216.124.127/health
